<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="description" content="一个安静、专注的个人笔记空间" />
    <title>留白 · 个人笔记</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app">
      <aside class="sidebar" aria-label="笔记列表">
        <header class="sidebar-header">
          <div class="brand-row">
            <a class="brand" href="#" aria-label="留白笔记首页">
              <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M7.5 4.5h9a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2Z"/><path d="M9 9h6M9 12h6M9 15h3"/></svg>
              </span>
              <span>留白</span>
            </a>
            <button class="icon-button mobile-only" id="mobileNewButton" type="button" aria-label="新建笔记" title="新建笔记">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>

          <button class="new-note-button" id="newNoteButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>新建笔记</span>
            <kbd>⌘ N</kbd>
          </button>

          <label class="search-box" for="searchInput">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            <input id="searchInput" type="search" placeholder="搜索笔记…" autocomplete="off" />
            <span class="search-shortcut" aria-hidden="true">⌘ F</span>
          </label>

          <div class="list-summary">
            <span id="listHeading">所有笔记</span>
            <span id="noteCount">0 篇</span>
          </div>
        </header>

        <div class="notes-list" id="notesList" role="list"></div>
      </aside>

      <main class="workspace" id="workspace">
        <section class="editor-empty" id="editorEmpty">
          <div class="empty-illustration" aria-hidden="true">
            <span class="empty-sheet empty-sheet-back"></span>
            <span class="empty-sheet empty-sheet-front">
              <i></i><i></i><i></i>
            </span>
          </div>
          <h1>留一点空间给想法</h1>
          <p>记录灵感、清单，或只是此刻的念头。</p>
          <button class="primary-button" id="emptyNewButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            写下第一篇笔记
          </button>
          <small>笔记仅保存在此浏览器中</small>
        </section>

        <section class="editor-panel" id="editorPanel" hidden aria-label="笔记编辑器">
          <header class="editor-toolbar">
            <button class="back-button mobile-only" id="backButton" type="button" aria-label="返回笔记列表">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
              <span>笔记</span>
            </button>
            <div class="save-state" id="saveState" role="status" aria-live="polite">
              <span class="save-dot"></span>
              已保存
            </div>
            <div class="toolbar-actions">
              <button class="icon-button" id="pinButton" type="button" aria-label="置顶笔记" title="置顶笔记">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 4 6 6-3 1-4 4-1 5-2.5-2.5-2.5-2.5-2.5-2.5 5-1 4-4 1-3Z"/><path d="m9.5 14.5-5 5"/></svg>
              </button>
              <button class="icon-button danger-button" id="deleteButton" type="button" aria-label="删除笔记" title="删除笔记">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
              </button>
            </div>
          </header>

          <div class="editor-content">
            <input class="title-input" id="titleInput" type="text" maxlength="120" placeholder="无标题笔记" aria-label="笔记标题" />
            <div class="editor-meta">
              <time id="updatedTime"></time>
              <span aria-hidden="true">·</span>
              <span id="characterCount">0 字</span>
            </div>
            <textarea class="body-input" id="bodyInput" placeholder="从这里开始写下你的想法…" aria-label="笔记正文"></textarea>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="deleteModal" hidden>
      <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogDescription">
        <div class="dialog-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 8v4M12 16h.01"/><path d="M10.3 4.5 3.2 17a2 2 0 0 0 1.8 3h14a2 2 0 0 0 1.8-3L13.7 4.5a2 2 0 0 0-3.4 0Z"/></svg>
        </div>
        <h2 id="dialogTitle">删除这篇笔记？</h2>
        <p id="dialogDescription">删除后无法恢复，请确认是否继续。</p>
        <div class="dialog-actions">
          <button class="secondary-button" id="cancelDeleteButton" type="button">取消</button>
          <button class="confirm-delete-button" id="confirmDeleteButton" type="button">删除笔记</button>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
